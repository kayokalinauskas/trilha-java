name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Exercícios Java (soluções e starters)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Soluções de referência passam em todos os testes
        run: mvn -B -f java/pom.xml verify
      - name: Starters compilam (os testes deles DEVEM falhar — não são executados aqui)
        run: mvn -B -f java/pom.xml -P starters test-compile

  site:
    name: Site (build + busca)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Catálogo está em dia com o conteúdo
        run: |
          npm run docs:catalogo
          git diff --exit-code DOCUMENTACAO.md || (echo "::error::Rode 'npm run docs:catalogo' e faça commit do DOCUMENTACAO.md" && exit 1)
      - name: Checagem de tipos e conteúdo
        run: npm run check
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PUBLICAR_PAGES == 'true'
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    # Desligado até a variável do repositório PUBLICAR_PAGES ser 'true' (Settings → Secrets and variables → Actions → Variables).
    if: vars.PUBLICAR_PAGES == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [java, site]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
