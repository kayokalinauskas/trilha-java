# Configuração do exercício 09.04 (carregada por @PropertySource em ImoveisApplication).
spring.datasource.url=jdbc:h2:mem:imoveis-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.flyway.locations=classpath:db/imoveis
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
