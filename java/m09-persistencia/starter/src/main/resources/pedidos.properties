# Configuração do exercício 09.02 (carregada por @PropertySource em PedidosApplication).
spring.datasource.url=jdbc:h2:mem:pedidos-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.flyway.locations=classpath:db/pedidos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Liga as estatísticas do Hibernate: é assim que os testes contam os comandos SQL.
spring.jpa.properties.hibernate.generate_statistics=true
# Para VER o SQL gerado enquanto você trabalha, descomente:
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
