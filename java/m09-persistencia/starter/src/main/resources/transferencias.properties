# Configuração do exercício 09.03 (carregada por @PropertySource em TransferenciasApplication).
spring.datasource.url=jdbc:h2:mem:transferencias-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
spring.datasource.hikari.maximum-pool-size=20
spring.flyway.locations=classpath:db/transferencias
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
