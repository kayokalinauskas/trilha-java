# Configuração do exercício 09.01 (carregada por @PropertySource em MatriculasApplication).
spring.datasource.url=jdbc:h2:mem:matriculas-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
spring.flyway.locations=classpath:db/matriculas
# O Hibernate NÃO cria tabelas: ele confere se as suas entidades batem com o schema criado pelo Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.generate_statistics=true
