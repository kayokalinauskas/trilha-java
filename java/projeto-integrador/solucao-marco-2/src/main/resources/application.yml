spring:
  application:
    name: fintech-core
  datasource:
    url: jdbc:postgresql://localhost:5432/fintech
    username: fintech
    password: fintech
  jpa:
    open-in-view: false          # sem consultas escondidas na camada web
    hibernate:
      ddl-auto: validate         # quem cria o schema é o Flyway; o Hibernate só confere
  docker:
    compose:
      lifecycle-management: start-only   # mvn spring-boot:run sobe o PostgreSQL do compose.yaml

springdoc:
  swagger-ui:
    path: /docs
