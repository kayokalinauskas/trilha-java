# PostgreSQL e Kafka para desenvolvimento. Com spring-boot-docker-compose no classpath,
# "mvn spring-boot:run" sobe estes serviços sozinho e configura as conexões.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: fintech
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
    ports:
      - "5432:5432"
  kafka:
    # Um broker em modo KRaft (sem ZooKeeper), com a configuração padrão da imagem: localhost:9092.
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
