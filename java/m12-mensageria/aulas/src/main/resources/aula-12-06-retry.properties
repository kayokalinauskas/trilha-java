# Aula 12.06 (retry e DLQ). Carregado pela RetryApplication com @PropertySource.
spring.kafka.bootstrap-servers=localhost:9092
# Um grupo novo começa do início do tópico (o padrão do Kafka é "latest": só o que chegar depois).
spring.kafka.consumer.auto-offset-reset=earliest
# O produtor só confirma depois que as réplicas em sincronia gravaram (aula 12.03).
spring.kafka.producer.acks=all
