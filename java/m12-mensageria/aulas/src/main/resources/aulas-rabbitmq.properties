# Aula 12.02 - RabbitMQ (ClinicaApplication)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Publicador: o broker confirma cada mensagem (ack/nack) e devolve as que não têm rota.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumidores: prefetch padrão de 250 baixado para 20 (a fábrica de laudos usa 1).
spring.rabbitmq.listener.simple.prefetch=20
# Exceção no listener = rejeitar SEM requeue (vai para a DLX), em vez do loop de reentregas.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Falhas transitórias: 1 tentativa + 2 repetições (1 s, depois 2 s) antes de rejeitar.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

clinica.demo.publicar=true
