# Exercício 12.01 — retry do listener: 1 tentativa + 2 repetições (200 ms, depois 400 ms).
# Esgotadas as tentativas, o recuperador padrão rejeita a mensagem sem requeue -> DLX.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=200ms
spring.rabbitmq.listener.simple.retry.multiplier=2
# Até 10 mensagens em trânsito por consumidor: o padrão (250) favorece a vazão, mas prende
# muitas mensagens num consumidor lento enquanto os outros ficam ociosos.
spring.rabbitmq.listener.simple.prefetch=10
