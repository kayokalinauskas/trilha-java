# Exercício 14.04 — pipeline de CI (no repositório: .github/workflows/ci.yml).
name: ci

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn package -DskipTests
