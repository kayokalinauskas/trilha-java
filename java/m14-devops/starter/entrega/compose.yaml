# Exercício 14.04 — sobe, mas às vezes a app cai porque o banco ainda não aceita conexões.
services:
  app:
    build:
      context: ..
      dockerfile: entrega/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trilha
      SPRING_DATASOURCE_USERNAME: trilha
      SPRING_DATASOURCE_PASSWORD: trilha123
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: trilha
      POSTGRES_USER: trilha
      POSTGRES_PASSWORD: trilha123
