# Exercício 14.03 — perfil "saude"
# /actuator/health/liveness e /actuator/health/readiness já vêm ligados no Spring Boot 4
# (management.endpoint.health.probes.enabled=true por padrão). O que falta é dizer o que entra em cada um.
# Readiness: "consigo atender agora?" -> inclui o provedor externo.
# Liveness NÃO inclui dependências externas: se o provedor cair, reiniciar o pod não ajuda.
management.endpoint.health.group.readiness.include=readinessState,provedor
management.endpoint.health.group.readiness.show-details=always
# O /actuator/health geral mostra só o status (é público).
management.endpoint.health.show-details=never
