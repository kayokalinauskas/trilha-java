# Exercício 14.01 — logs em JSON no formato ECS (Elastic Common Schema), um objeto por linha.
# Fica aqui, e não num @PropertySource: o logging é configurado antes de o Spring ler as outras fontes.
# O Spring Boot inclui o MDC e os pares chave-valor da API fluente do SLF4J como campos do JSON.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=trilha-m14

# Exercícios 14.02 e 14.03 — Actuator: só o necessário exposto na web.
management.endpoints.web.exposure.include=health,prometheus
# Uma tag comum a todas as métricas: no Prometheus, identifica a aplicação.
management.metrics.tags.aplicacao=trilha-m14
