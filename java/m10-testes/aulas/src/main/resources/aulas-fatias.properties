# Aula 10.04. O H2 em memória recebe o esquema gerado pelo Hibernate a partir das entidades.
# Este módulo também traz o Flyway (da aula 10.05); com ele no classpath, o Spring Boot deixa de gerar o
# esquema sozinho, por isso as duas linhas abaixo dizem explicitamente o que a aula 10.04 usa.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
