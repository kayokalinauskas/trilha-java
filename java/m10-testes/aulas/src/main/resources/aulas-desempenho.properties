# Aula 10.08. H2 em memória com o esquema do Flyway; o que interessa aqui é o pool de conexões.
spring.datasource.url=jdbc:h2:mem:frete;DB_CLOSE_DELAY=-1
spring.flyway.locations=classpath:db/aulas-desempenho
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# O tamanho padrão do HikariCP já é 10; fica explícito porque ele é o gargalo da v1.
spring.datasource.hikari.maximum-pool-size=10
# Quanto tempo uma requisição espera por uma conexão livre antes de falhar (padrão: 30 s).
spring.datasource.hikari.connection-timeout=1000
