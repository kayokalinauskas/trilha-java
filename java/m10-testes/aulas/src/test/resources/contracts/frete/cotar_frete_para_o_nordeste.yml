description: |
  Solução do checkpoint da aula 10.07: o serviço de pedidos passou a vender para o Recife.
  Um pacote de 1 kg para um CEP que começa com 5 custa 27.90 e chega em 7 dias úteis.
name: cotar_frete_para_o_nordeste
request:
  method: POST
  url: /fretes/cotacoes
  headers:
    Content-Type: application/json
  body:
    cepDestino: "50030-230"
    pesoEmGramas: 1000
  matchers:
    body:
      - path: $.cepDestino
        type: by_regex
        value: "5[0-9]{4}-[0-9]{3}"
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    valor: "27.90"
    prazoEmDiasUteis: 7
  matchers:
    body:
      - path: $.valor
        type: by_regex
        value: "[0-9]+\\.[0-9]{2}"
