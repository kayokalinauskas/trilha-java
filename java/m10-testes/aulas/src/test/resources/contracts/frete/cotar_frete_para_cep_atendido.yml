description: |
  O serviço de pedidos cota o frete de um carrinho de 1,2 kg para São Paulo.
  Ele usa o valor (como texto, com duas casas) e o prazo em dias úteis; o resto não importa.
name: cotar_frete_para_cep_atendido
request:
  method: POST
  url: /fretes/cotacoes
  headers:
    Content-Type: application/json
  body:
    cepDestino: "01310-100"
    pesoEmGramas: 1200
  matchers:
    body:
      - path: $.cepDestino
        type: by_regex
        value: "[0-3][0-9]{4}-[0-9]{3}"
      - path: $.pesoEmGramas
        type: by_regex
        predefined: number
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    valor: "23.90"
    prazoEmDiasUteis: 3
  matchers:
    body:
      - path: $.valor
        type: by_regex
        value: "[0-9]+\\.[0-9]{2}"
      - path: $.prazoEmDiasUteis
        type: by_type
