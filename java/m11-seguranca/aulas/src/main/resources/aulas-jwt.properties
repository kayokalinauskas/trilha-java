# Aula 11.03. Quem a API de extrato aceita como emissor de tokens, e para quem o token precisa ter sido emitido.
# Em produção, estes valores vêm de variáveis de ambiente (EXTRATO_SEGURANCA_JWK_SET_URI etc.).
# Nos testes, o jwk-set-uri aponta para o servidor de chaves falso que o próprio teste sobe.
extrato.seguranca.emissor=https://auth.banco.test/realms/clientes
extrato.seguranca.audiencia=extrato-api
extrato.seguranca.jwk-set-uri=https://auth.banco.test/realms/clientes/protocol/openid-connect/certs
extrato.seguranca.tolerancia-do-relogio=30s
